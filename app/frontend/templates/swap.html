{% extends "base.html" %}

{% block body %}
<div class="center">
    <h2>Gerda-Krendel</h2>
    <form action="/swap" method="POST">
        <input type="hidden" name="pool_id" value="ger_kre">
        <select name="token">
            <option value="{{gerda}}">Gerda</option>
            <option value="{{krendel}}">Krendel</option>
        </select>
        <input type="number" name="amount" min="0" step="10" placeholder="Количество отданных">
        <button type="submit">Обменять</button>
    </form>
</div>

<div class="center">
    <h2>Krendel-Rtk</h2>
    <form action="/swap" method="POST">
        <input type="hidden" name="pool_id" value="kre_rtk">
        <select name="token">
            <option value="{{krendel}}">Krendel</option>
            <option value="{{rtk}}">Rtk</option>
        </select>
        <input type="number" name="amount" min="0" step="10" placeholder="Количество отданных">
        <button type="submit">Обменять</button>
    </form>
</div>

<br>
<hr>

<div class="center">
    <h2>Router</h2>
    <form action="/router_swap" method="POST">
        <label>Вы отдаете:</label>
        <select name="token_in">
            <option value="{{gerda}}">Gerda</option>
            <option value="{{rtk}}">Rtk</option>
        </select>
        <label>Вы получаете:</label>
        <select name="token_out">
            <option value="{{gerda}}">Gerda</option>
            <option value="{{rtk}}">Rtk</option>
        </select>
        <input type="number" name="amount" min="0" step="10" placeholder="Количество отданных">
        <button type="submit">Обменять</button>
    </form>
</div>
{% endblock %}
