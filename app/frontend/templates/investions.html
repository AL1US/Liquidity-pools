{% extends "base.html" %}

{% block body %}
<div class="center">
    <h1>Поднятие ликвидности</h1>
</div>

<div class="center">
    <h2>Gerda-Krendel</h2>
    <form action="/liquidity_up" method="POST">
        <input type="hidden" name="pool_id" value="ger_kre">
        <select name="token">
            <option value="{{gerda}}">Gerda</option>
            <option value="{{krendel}}">Krendel</option>
        </select>
        <input type="number" name="amount" min="0" step="10" placeholder="Количество отданных">
        <button type="submit">Обменять</button>
    </form>
</div>

<div class="center">
    <h2>Krendel-Rtk</h2>
    <form action="/liquidity_up" method="POST">
        <input type="hidden" name="pool_id" value="kre_rtk">
        <select name="token">
            <option value="{{krendel}}">Krendel</option>
            <option value="{{rtk}}">Rtk</option>
        </select>
        <input type="number" name="amount" min="0" step="10" placeholder="Количество отданных">
        <button type="submit">Обменять</button>
    </form>
</div>
<br>
<hr>
<div class="center">
    <h1>Стэйкинг</h1>
    <form action="/stake" method="POST">
        <input type="hidden" value="{{professional}}" name="token">
        <input type="number" name="amount" min="0" step="10" placeholder="Количество отданных">
        <button type="submit">Застейкать</button>
    </form>
    <form action="/claim_reward" method="POST">
        <p>Доступная награда: {{reward}}</p>
        <button type="submit">Получить</button>
    </form>
</div>

{% endblock %}
